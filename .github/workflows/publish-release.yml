# Action pinning (P2): every `uses: actions/...` step is pinned to an immutable
# full commit SHA with a trailing `# vX` comment for human readability.
# To update: resolve the new tag via `gh api` (lightweight tags):
#   gh api repos/actions/checkout/git/refs/tags/v7 --jq '.object.sha'
# Verify the SHA matches the intended release, replace the SHA in this file,
# keep the `# vX.Y.Z` comment, then run `pwsh -File scripts/release-tooling-tests.ps1`.

name: publish-release

# STAGE B of the two-stage production release architecture: publish the
# EXISTING immutable production candidate produced by the
# prepare-release-candidate workflow (STAGE A). This workflow NEVER builds,
# NEVER signs, and NEVER executes the candidate executable: it downloads the
# exact artifact retained by the Stage A run, re-verifies every production
# condition against those exact bytes, and only then creates the GitHub
# Release from the downloaded bytes.
#
# TRUST BOUNDARY (release-policy hardening): the policy that decides whether
# the candidate may be published NEVER comes from the candidate. The three
# trust domains are physically separated:
#
#   $GITHUB_WORKSPACE/policy            TRUSTED RELEASE POLICY
#   $GITHUB_WORKSPACE/candidate-source  CANDIDATE SOURCE (DATA ONLY)
#   $GITHUB_WORKSPACE/candidate-artifact CANDIDATE ARTIFACT (DATA ONLY)
#
# The trusted policy checkout is the revision of THIS workflow being
# executed: for a workflow_dispatch on main, github.sha is the last commit on
# main (the dispatch revision, i.e. exactly the revision of
# publish-release.yml that GitHub is executing) and github.workflow_sha is
# the commit SHA of the workflow file. The workflow FAILS unless
# github.ref == refs/heads/main AND github.workflow_sha == github.sha, so
# the policy checkout can only be the trusted revision. All publication
# policy functions (Test-PublicationEligibility and the release-tooling
# module) are dot-sourced EXCLUSIVELY from policy/scripts; files under
# candidate-source/ and candidate-artifact/ are DATA ONLY and are never
# dot-sourced, imported, or executed - Stage B NEVER launches the candidate
# executable or any candidate helper (no candidate version self-report, no
# candidate native-ABI self-test, no candidate script), in either job. An
# old candidate that was valid under
# an old policy is rejected whenever it no longer satisfies the CURRENT
# policy (releasePolicySchemaVersion >= current minimum, current provider
# allowlist, current key-protection policy, current publisher-identity
# policy, current timestamp/certificate policy).
#
# LEAST PRIVILEGE: publication is split into two jobs.
#   JOB 1 (verify): contents: read - ALL release gates happen here. Candidate
#       files are READ/PARSED/HASHED/VERIFIED strictly as DATA; NO candidate
#       process ever runs in this job or anywhere in Stage B, and no
#       write-capable credential exists in this job.
#   JOB 2 (publish): contents: write - obtains ONLY the verified same-run
#       handoff (publication-verification.json + RELEASE_NOTES.md +
#       release-external-evidence.json), performs the final hash identity
#       check against the exact Stage A bytes, and creates the release. It
#       never executes candidate code and never runs candidate scripts.
# JOB 1 additionally holds actions: write (documented deviation from the
# strict "actions: read" ideal) solely to upload the same-run verification
# handoff artifact; it cannot create releases or tags (no contents: write).
# STAGE B NEVER EXECUTES THE CANDIDATE: candidate source and candidate
# artifact are DATA ONLY in BOTH jobs (the verify job gates them strictly as
# data before the publish job acquires contents: write).
#
# The tag is DERIVED as "v" + the authoritative semantic version recorded in
# the candidate manifest; no free-form tag input exists, so arbitrary or
# mismatched tags are structurally impossible and the protected v* tag
# namespace is preserved. The tag resolves to the exact candidate source
# SHA.
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: 'Stage A (prepare-release-candidate) workflow run ID that produced the candidate artifact'
        required: true
        type: string
      external-evidence:
        description: 'release-external-evidence.json content (schemaVersion 3) proving the human, physical, and Windows compatibility gates with qualification-bundle and structured machine-report bindings for the exact candidate. REQUIRED.'
        required: true
        type: string
      qualification-evidence-run-id:
        description: 'Optional workflow run ID containing a data-only handoff produced by merge-qualification-evidence.ps1 -HandoffDir. Required when external evidence references qualification/external files not retained in Stage A.'
        required: false
        default: ''
        type: string
      qualification-evidence-artifact-name:
        description: 'Optional artifact name for the data-only qualification evidence handoff. The artifact must contain release-external-evidence.json and qualification/external/** only.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 - VERIFY: resolve, locate, download, and gate the candidate. NO
  # contents: write. NO candidate execution: candidate source and candidate
  # artifact are handled strictly as data. The trusted policy module is
  # loaded ONLY from policy/.
  # ---------------------------------------------------------------------------
  verify:
    runs-on: windows-latest
    permissions:
      contents: read
      # Documented deviation: actions: write is held here ONLY so this job can
      # upload the same-run verification handoff artifact that the publish job
      # consumes. It grants no release/tag capability (contents stays read)
      # and expires with the run. All release gates (candidate files handled
      # strictly as DATA - never executed) happen in this job, before the
      # publish job acquires the release-mutation (contents write) permission.
      actions: write
    outputs:
      head_sha: ${{ steps.resolve-run.outputs.head_sha }}
      candidate_artifact_name: ${{ steps.locate-candidate.outputs.artifact_name }}
      qualification_bundle_sha256: ${{ steps.publication-gate.outputs.qualification_bundle_sha256 }}
    steps:
      # The trusted policy revision is the revision of THIS workflow being
      # executed. GitHub Actions semantics (official documentation):
      #   github.ref         - fully-formed ref the workflow was dispatched
      #                        from (workflow_dispatch: the selected branch)
      #   github.sha         - the commit SHA that triggered the workflow
      #                        (workflow_dispatch: last commit on the branch)
      #   github.workflow_sha - the commit SHA of the workflow file
      # The workflow must run from main, and the workflow-file revision must
      # be the dispatch commit; anything else fails closed before any policy
      # evaluation, so the policy checkout below is exactly the trusted
      # revision of publish-release.yml being executed.
      - name: Verify trusted dispatch contract (policy revision == running workflow revision)
        shell: pwsh
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if ($env:WORKFLOW_REF -ne 'refs/heads/main') {
            throw "this workflow must be dispatched from main (got '$env:WORKFLOW_REF'); the trusted release policy is the main revision being executed"
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_SHA)) {
            throw 'github.workflow_sha is empty; the trusted policy revision cannot be bound to the workflow file being executed'
          }
          if ($env:WORKFLOW_SHA -ne $env:DISPATCH_SHA) {
            throw "github.workflow_sha '$env:WORKFLOW_SHA' != github.sha '$env:DISPATCH_SHA'; the workflow-file revision being executed is not the dispatch commit - refusing to guess a trusted policy revision"
          }
          Write-Host "Trusted dispatch contract verified: ref=$env:WORKFLOW_REF workflow_sha=$env:WORKFLOW_SHA sha=$env:DISPATCH_SHA (policy revision == the revision of publish-release.yml being executed)" -ForegroundColor Green

      # TRUSTED RELEASE POLICY: checkout the workflow/policy revision into
      # policy/. This tree supplies ALL release-policy code; the candidate
      # can never replace it.
      - name: Checkout trusted release policy (current workflow revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Least privilege: this checkout performs no authenticated git
          # operation (push/merge); no credentials are persisted in .git.
          persist-credentials: false
          ref: ${{ github.sha }}
          path: policy

      - name: Verify trusted policy checkout revision
        shell: pwsh
        env:
          POLICY_SHA: ${{ github.sha }}
        run: |
          $actual = (git -C policy rev-parse HEAD).Trim()
          if ($actual -ne $env:POLICY_SHA) {
            throw "Trusted policy checkout is at $actual but the trusted policy revision is $env:POLICY_SHA"
          }
          $workflow = Join-Path 'policy' '.github\workflows\publish-release.yml'
          if (-not (Test-Path -LiteralPath $workflow -PathType Leaf)) {
            throw 'The trusted policy checkout does not contain .github/workflows/publish-release.yml; refusing to evaluate candidates under an untrusted policy tree'
          }
          Write-Host "Trusted policy revision verified: $actual (contains the executing publish-release.yml)" -ForegroundColor Green

      # The publication target is the Stage A run, not this run: the source
      # run must exist, must belong to this repository (gh resolves it
      # against ${{ github.repository }}), must be the
      # prepare-release-candidate workflow, and must have completed
      # successfully. Its head SHA becomes the exact candidate SHA.
      - name: Resolve and verify the Stage A source run
        id: resolve-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.run-id }}
        run: |
          # Dispatch inputs travel as DATA via env:, never interpolated into
          # the script text (R21-001).
          $runId = $env:CANDIDATE_RUN_ID
          if ($runId -notmatch '^\d+$') {
            throw "run-id must be a numeric GitHub Actions run ID, got '$runId'"
          }
          $view = gh run view $runId --repo ${{ github.repository }} --json path,status,conclusion,headSha,workflowName 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "Stage A run $runId does not exist or is not readable in ${{ github.repository }} (wrong run id, other repository, or insufficient permissions): $view"
          }
          $run = $view | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/prepare-release-candidate.yml') {
            throw "run $runId belongs to workflow '$($run.path)'; only prepare-release-candidate.yml runs can produce production candidates"
          }
          if ($run.status -ne 'completed') {
            throw "Stage A run $runId has status '$($run.status)'; only completed runs can be published"
          }
          if ($run.conclusion -ne 'success') {
            throw "Stage A run $runId concluded '$($run.conclusion)'; only successful runs can be published"
          }
          if ($run.headSha -notmatch '^[0-9a-f]{40}$') {
            throw "Stage A run $runId has a malformed head SHA: '$($run.headSha)'"
          }
          Write-Host "Stage A run verified: workflow=$($run.path) status=$($run.status) conclusion=$($run.conclusion) headSha=$($run.headSha)"
          "head_sha=$($run.headSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Locate the EXACT candidate artifact in the Stage A run. The artifact
      # name must match tabdock-candidate-<sha>-<run-id>, must not be
      # expired, and must be unique; the embedded SHA must equal the run's
      # head SHA. An expired or missing artifact fails closed here.
      - name: Locate the production candidate artifact
        id: locate-candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.run-id }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve-run.outputs.head_sha }}
        run: |
          $runId = $env:CANDIDATE_RUN_ID
          $headSha = $env:EXPECTED_HEAD_SHA
          $expectedName = "tabdock-candidate-$headSha-$runId"
          $list = gh api "repos/${{ github.repository }}/actions/runs/$runId/artifacts" --paginate --jq '[.artifacts[] | { name, id, expired }]' 2>&1
          if ($LASTEXITCODE -ne 0) {
            throw "cannot list artifacts of run $runId: $list"
          }
          try { $artifacts = @($list | ConvertFrom-Json) }
          catch { throw "cannot parse the artifact listing of run $runId: $list" }
          $live = @($artifacts | Where-Object { $_.name -eq $expectedName -and -not $_.expired })
          if ($live.Count -eq 0) {
            $expired = @($artifacts | Where-Object { $_.name -eq $expectedName -and $_.expired })
            if ($expired.Count -gt 0) {
              throw "candidate artifact '$expectedName' of run $runId is EXPIRED; the Stage A artifact must be re-prepared"
            }
            throw "run $runId has no live candidate artifact named '$expectedName' (wrong run id, artifact deleted, or not a prepare-release-candidate run)"
          }
          if ($live.Count -gt 1) {
            throw "run $runId has $($live.Count) candidate artifacts named '$expectedName'; refusing to guess"
          }
          Write-Host "Candidate artifact located: $($live[0].name) (id $($live[0].id))"
          "artifact_name=$($live[0].name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "artifact_id=$($live[0].id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # CANDIDATE SOURCE (DATA ONLY): read-only checkout of the exact
      # candidate SHA. It is used ONLY to re-read the authoritative project
      # version at that exact commit and to prove the candidate SHA. Its
      # scripts are NEVER executed, dot-sourced, or imported: all release
      # policy comes from the trusted policy/ checkout above.
      - name: Checkout candidate source (data only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Least privilege: no authenticated git operation is performed on
          # the candidate tree; no credentials are persisted in .git.
          persist-credentials: false
          ref: ${{ steps.resolve-run.outputs.head_sha }}
          path: candidate-source

      - name: Verify exact candidate source SHA
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ steps.resolve-run.outputs.head_sha }}
        run: |
          $actual = (git -C candidate-source rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD_SHA) {
            throw "Candidate source is at $actual but the Stage A run head SHA is $env:EXPECTED_HEAD_SHA"
          }
          Write-Host "Candidate source SHA verified: $actual"

      # Download the EXACT artifact from the Stage A run using the supported
      # cross-run mechanism (run-id + repository + github-token). The artifact
      # is extracted as-is; nothing in this workflow builds or signs, and the
      # candidate executable is never modified.
      - name: Download the EXACT Stage A candidate artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.locate-candidate.outputs.artifact_name }}
          run-id: ${{ inputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate-artifact

      # Optional external-machine handoff. This artifact is data-only and is
      # never dot-sourced or executed. It supplies the staged bundle files
      # produced after physical/Windows qualification; candidate bytes remain
      # sourced exclusively from the exact Stage-A artifact above.
      - name: Validate optional qualification evidence handoff inputs
        if: ${{ inputs.qualification-evidence-artifact-name != '' }}
        shell: pwsh
        env:
          EVIDENCE_RUN_ID: ${{ inputs.qualification-evidence-run-id }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EVIDENCE_RUN_ID)) {
            throw 'qualification-evidence-run-id is required when qualification-evidence-artifact-name is supplied'
          }

      - name: Download data-only qualification evidence handoff
        if: ${{ inputs.qualification-evidence-artifact-name != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.qualification-evidence-artifact-name }}
          run-id: ${{ inputs.qualification-evidence-run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: qualification-evidence-handoff

      - name: Stage bounded qualification evidence data
        if: ${{ inputs.qualification-evidence-artifact-name != '' }}
        shell: pwsh
        env:
          EVIDENCE_RUN_ID: ${{ inputs.qualification-evidence-run-id }}
        run: |
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'qualification-evidence-handoff'
          if (-not (Test-Path -LiteralPath $handoff -PathType Container)) { throw 'downloaded qualification evidence handoff directory is missing' }
          foreach ($file in @(Get-ChildItem -LiteralPath $handoff -Recurse -File)) {
            $relative = [IO.Path]::GetRelativePath($handoff, $file.FullName).Replace('\', '/')
            if ($relative -eq 'release-external-evidence.json') { continue }
            if (-not $relative.StartsWith('qualification/external/', [StringComparison]::OrdinalIgnoreCase)) {
              throw "qualification evidence handoff contains an unallowed path: '$relative'"
            }
            $destination = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'candidate-artifact') ($relative.Replace('/', '\'))
            $parent = [IO.Path]::GetDirectoryName($destination)
            if (-not (Test-Path -LiteralPath $parent -PathType Container)) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
            if (Test-Path -LiteralPath $destination -PathType Leaf) {
              $sourceHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
              $destinationHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
              if ($sourceHash -ne $destinationHash) { throw "qualification evidence would overwrite a different retained artifact: '$relative'" }
            }
            else { Copy-Item -LiteralPath $file.FullName -Destination $destination }
          }
          "Qualification evidence handoff staged as data-only input from run $env:EVIDENCE_RUN_ID" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Fail-closed publication gate before any release mutation. The shared
      # release-tooling gate runs from the TRUSTED POLICY checkout and
      # re-verifies against the DOWNLOADED bytes: manifest PASS for this
      # exact SHA and version; releaseMode PRODUCTION; manifest workflowRunId
      # == the Stage A run; CURRENT release-policy schema contract
      # (releasePolicySchemaVersion >= minimum); binary identity in the
      # manifest agrees with the semantic version (the buildIdentity record
      # was generated and verified by TRUSTED Stage A; Stage B validates the
      # manifest contract but NEVER executes the candidate binary to re-ask
      # it); on-disk SHA == manifest
      # artifactSha256 == SHA256SUMS.txt; schema-v3 external evidence bound
      # to this SHA, the final artifact hash, and this exact run + artifact,
      # with finalWindowsHumanSmoke, physicalMixedDpi, and
      # windowsCompatibility (Windows 10 + 11) all PASS; signingStatus
      # SIGNED + SIGNATURE_VERIFIED + finalSignedSha256 == final artifact
      # hash, no test-only mock signing, an APPROVED production signing
      # provider with approved non-exportable key protection (CLOUD_HSM),
      # recorded signed-certificate identity (subject, thumbprint, issuer,
      # validity, code-signing EKU) AND the CURRENT trusted publisher policy
      # (SIGNING_EXPECTED_SUBJECT) equal to the manifest subject AND the
      # actual certificate subject, timestampStatus VERIFIED with recorded
      # RFC3161 timestamper identity cross-checked against the bytes, and an
      # independent `signtool verify /pa /v /tw` + RFC3161 timestamp
      # verification on the downloaded executable. Any failure aborts before
      # any handoff is produced and before `gh release create`. Stage B
      # NEVER contacts the signing provider and NEVER re-signs: it validates
      # the already-signed immutable artifact with Windows signature
      # verification and its retained provenance.
      - name: Fail-closed publication gate (trusted policy only)
        id: publication-gate
        shell: pwsh
        env:
          RELEASE_EXTERNAL_EVIDENCE: ${{ inputs.external-evidence }}
          CANDIDATE_RUN_ID: ${{ inputs.run-id }}
          EXPECTED_HEAD_SHA: ${{ steps.resolve-run.outputs.head_sha }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.locate-candidate.outputs.artifact_name }}
          SIGNING_EXPECTED_SUBJECT: ${{ vars.SIGNING_EXPECTED_SUBJECT }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'policy/scripts/release-tooling.ps1')
          $dir = Join-Path $env:GITHUB_WORKSPACE 'candidate-artifact'
          $evidencePath = Join-Path $dir 'release-external-evidence.json'
          [IO.File]::WriteAllText($evidencePath, $env:RELEASE_EXTERNAL_EVIDENCE, [Text.UTF8Encoding]::new($false))
          $manifest = Get-Content (Join-Path $dir 'release-manifest.json') -Raw | ConvertFrom-Json
          $expectedSha = $env:EXPECTED_HEAD_SHA
          $expectedVersion = [string]$manifest.semanticVersion

          # Project -> manifest version authority: read from the CANDIDATE
          # SOURCE checkout (data only), never from the trusted policy tree.
          $projectVersion = Get-ProjectSemanticVersion (Join-Path $env:GITHUB_WORKSPACE 'candidate-source/TabDock.csproj')
          if ($projectVersion -ne $expectedVersion) {
            throw "Version authority mismatch: project <Version> '$projectVersion' at the candidate SHA != manifest semanticVersion '$expectedVersion'"
          }
          Write-Host "Project version authority: csproj <Version> $projectVersion == manifest semanticVersion $expectedVersion" -ForegroundColor Green

          $gate = Test-PublicationEligibility -ArtifactDir $dir -ExpectedSourceSha $expectedSha -ExpectedVersion $expectedVersion `
            -EvidencePath $evidencePath -RequireSigning `
            -ExpectedCandidateRunId $env:CANDIDATE_RUN_ID `
            -ExpectedCandidateArtifactName $env:CANDIDATE_ARTIFACT_NAME `
            -ExpectedPublisherSubject $env:SIGNING_EXPECTED_SUBJECT
          if (-not $gate.Eligible) {
            Write-Host 'Publication gate FAILED - refusing to publish the candidate:' -ForegroundColor Red
            $gate.Failures | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            throw "Refusing to publish the candidate: $($gate.Failures.Count) gate failure(s)"
          }
          $evidenceRecord = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $bundleSha = [string]$evidenceRecord.qualificationBundle.sha256
          if ($bundleSha -notmatch '^[0-9a-fA-F]{64}$') { throw 'validated external evidence did not carry a qualification bundle SHA-256' }
          "qualification_bundle_sha256=$bundleSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Qualification bundle SHA-256: $bundleSha" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "External evidence schema: $($evidenceRecord.schemaVersion); automated gate: PASS; physical topology: observed non-synthetic mixed-DPI evidence" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host 'Publication gate: PASS (evaluated exclusively by the CURRENT trusted policy)' -ForegroundColor Green

      # NO CANDIDATE EXECUTION IN STAGE B (trust-boundary closure): the
      # downloaded executable is NEVER launched - no version self-report, no
      # native-ABI self-test, no helper process, in EITHER job. A program
      # under evaluation is not an independent authority for its own release
      # eligibility. The identity guarantees are proven WITHOUT execution:
      #   - sourceCommitSha == run head SHA == candidate-source checkout SHA
      #   - candidate-source TabDock.csproj <Version> (parsed as data)
      #     == manifest.semanticVersion
      #   - manifest buildIdentity.semanticVersion / informationalVersion
      #     contract (generated + verified by TRUSTED Stage A) == manifest
      #     semanticVersion
      #   - on-disk SHA == manifest artifactSha256 == SHA256SUMS.txt ==
      #     finalSignedSha256 (the fail-closed gate above)
      #   - independent Authenticode + RFC3161 verification of the bytes
      # The gate above enforces all of this; the manifest contract is
      # validated here without re-running the candidate.

      # Auditable publication record: the publish-time eligibility verdict
      # computed by the CURRENT trusted policy from the downloaded bytes and
      # the validated evidence, plus the rendered release notes. This record
      # is the verified same-run handoff the publish job consumes; the
      # publish job trusts it ONLY for the final hash identity check and the
      # derived tag - it never re-evaluates or executes candidate code.
      - name: Write publication verification record and release notes (verified handoff)
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.run-id }}
          CANDIDATE_ARTIFACT_NAME: ${{ steps.locate-candidate.outputs.artifact_name }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'policy/scripts/release-tooling.ps1')
          $dir = Join-Path $env:GITHUB_WORKSPACE 'candidate-artifact'
          $handoff = Join-Path $env:GITHUB_WORKSPACE 'verified-handoff'
          New-Item -ItemType Directory -Path $handoff -Force | Out-Null
          $manifest = Get-Content (Join-Path $dir 'release-manifest.json') -Raw | ConvertFrom-Json
          $evidence = Get-Content (Join-Path $dir 'release-external-evidence.json') -Raw | ConvertFrom-Json
          $bundlePath = Join-Path $dir ([string]$evidence.qualificationBundle.relativePath)
          $bundleRecord = Get-Content -LiteralPath $bundlePath -Raw | ConvertFrom-Json
          $tag = Get-ReleaseTagFromVersion ([string]$manifest.semanticVersion)
          $verification = [ordered]@{
            recordKind                   = 'publication-verification'
            schemaVersion                = 1
            product                      = 'TabDock'
            semanticVersion              = $manifest.semanticVersion
            sourceCommitSha              = $manifest.sourceCommitSha
            artifactSha256               = $manifest.artifactSha256
            candidateWorkflowRunId       = $env:CANDIDATE_RUN_ID
            candidateArtifactName        = $env:CANDIDATE_ARTIFACT_NAME
            externalEvidenceSchemaVersion = [int]$evidence.schemaVersion
            qualificationBundleSha256     = [string]$evidence.qualificationBundle.sha256
            qualificationBundleSchemaVersion = [int]$bundleRecord.schemaVersion
            releaseTag                   = $tag
            productionReleaseEligibility = 'ELIGIBLE'
            verifiedAt                   = [DateTimeOffset]::UtcNow.ToString('O')
            trustedPolicyRevision        = $env:POLICY_SHA
            checks                       = [ordered]@{
              automatedQualification    = 'PASS'
              releasePolicySchema       = 'PASS'
              sourceCommitSha           = 'PASS'
              semanticVersion           = 'PASS'
              projectVersionAuthority   = 'PASS'
              tagBinding                = 'PASS'
              artifactTripleConsistency = 'PASS'
              sha256Sums                = 'PASS'
              candidateRunBinding       = 'PASS'
              candidateArtifactBinding  = 'PASS'
              externalEvidenceValid     = 'PASS'
              finalWindowsHumanSmoke    = 'PASS'
              physicalMixedDpi          = 'PASS'
              windowsCompatibility      = 'PASS'
              authenticodeSigning       = 'PASS'
              signatureVerification     = 'PASS'
              signingProviderApproved   = 'PASS'
              signingKeyProtection      = 'PASS'
              signingCertificateIdentity = 'PASS'
              publisherIdentityPolicy   = 'PASS'
              timestampVerification     = 'PASS'
              timestamperIdentity       = 'PASS'
              binaryIdentity            = 'PASS'
            }
          }
          $verification | ConvertTo-Json -Depth 5 | Set-Content -Path (Join-Path $handoff 'publication-verification.json') -Encoding utf8

          # Render release notes from the manifest and the validated evidence
          # (never from a rebuild). The tag is derived as v<semanticVersion>;
          # there is no tag input to disagree with the version.
          $sha = if ($manifest.finalSignedSha256) { $manifest.finalSignedSha256 } else { $manifest.artifactSha256 }
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("TabDock $($manifest.semanticVersion)")
          $lines.Add('')
          $lines.Add('## Release identity')
          $lines.Add('')
          $lines.Add("- Source commit: $($manifest.sourceCommitSha)")
          $lines.Add("- Executable SHA-256: $sha")
          $lines.Add("- Authenticode signing: $($manifest.signingStatus) (verification: $($manifest.signatureVerification), RFC3161 timestamp: $($manifest.timestampStatus))")
          $lines.Add("- Signing provider: $($manifest.signingProvider) (key protection $($manifest.signingKeyProtection); signing certificate $($manifest.signingCertificateSubject))")
          $lines.Add('- Runtime: .NET 8 self-contained, win-x64 single file (no install required)')
          $lines.Add('- Supported OS: Windows 10 (recent builds) and Windows 11, 64-bit')
          $lines.Add("- Published from the immutable Stage A candidate artifact (run $($manifest.workflowRunId)); no rebuild, no re-sign")
          $lines.Add('')
          $lines.Add('## Qualification')
          $lines.Add('')
          $lines.Add("- Automated qualification: $($manifest.qualificationStatus) (hermetic: builds, geometry/diagnostics/privacy/persistence self-tests, doctor/version, support-bundle privacy, OpenSpec validation)")
          $lines.Add("- Exact-SHA provenance: artifact produced by and qualified against commit $($manifest.sourceCommitSha)")
          $lines.Add('')
          $lines.Add('## External gates (production evidence)')
          $lines.Add('')
          $lines.Add("- Final human Windows smoke: $($evidence.finalWindowsHumanSmoke.status) - operator $($evidence.finalWindowsHumanSmoke.operator), completed $($evidence.finalWindowsHumanSmoke.completedAt)")
          $lines.Add("- Physical mixed-DPI qualification: $($evidence.physicalMixedDpi.status) - operator $($evidence.physicalMixedDpi.operator), completed $($evidence.physicalMixedDpi.completedAt)")
          $lines.Add("- Windows compatibility: $($evidence.windowsCompatibility.status) - Windows 10 x64 ($($evidence.windowsCompatibility.windows10.build), native ABI selftest recorded), Windows 11 x64 ($($evidence.windowsCompatibility.windows11.build), native ABI selftest recorded)")
          $lines.Add("- Evidence is bound to source commit $($manifest.sourceCommitSha), final artifact SHA-256 $($manifest.artifactSha256), Stage A run $($manifest.workflowRunId), and candidate artifact $($evidence.candidateArtifactName); the validated record is attached as release-external-evidence.json and the publish-time verdict as publication-verification.json")
          $lines.Add('')
          $lines.Add('## Known limitations')
          $lines.Add('')
          $lines.Add('See the repository README "Known limitations" section. The most important ones:')
          $lines.Add('')
          $lines.Add('- Maximizing a docked guest window itself fills the whole monitor (cosmetic UX gap).')
          $lines.Add('- Elevated (admin) applications cannot be captured by a standard-user TabDock (UIPI).')
          $lines.Add('- HWNDs are not stable across reboots; persisted state is layout intent, not live windows.')
          $lines.Add('- Force-killing TabDock is safe (guests are never reparented); the journaled recovery restores identity-valid guests on next launch.')
          $lines.Add('')
          $lines.Add('## Support')
          $lines.Add('')
          $lines.Add('- Read-only diagnostics: TabDock.exe --doctor, --support-bundle')
          $lines.Add('- Privacy: support bundles are sanitized; raw logs are local-only and must be redacted before sharing.')
          $lines -join "`n" | Set-Content -Path (Join-Path $handoff 'RELEASE_NOTES.md') -Encoding utf8

          # R21-002: the validated external-evidence file travels IN the
          # verified same-run handoff (bound to publication-verification.json).
          # The publish job consumes THIS copy for the release asset; it never
          # relies on the pristine Stage A candidate artifact containing it
          # (Stage A never produces release-external-evidence.json).
          Copy-Item -LiteralPath (Join-Path $dir 'release-external-evidence.json') -Destination (Join-Path $handoff 'release-external-evidence.json')
          Write-Host "Verified handoff written: publication-verification.json + RELEASE_NOTES.md + release-external-evidence.json (qualification bundle $($evidence.qualificationBundle.sha256), derived tag $tag)" -ForegroundColor Green

      # The verified same-run handoff is the ONLY thing the publish job
      # consumes from this job. It is small (verdict record + release notes +
      # the validated external-evidence file); the publish job re-downloads
      # the EXACT Stage A bytes itself.
      - name: Upload verified same-run handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tabdock-verified-${{ github.run_id }}
          path: verified-handoff
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # JOB 2 - PUBLISH: contents: write exists ONLY here, and only AFTER the
  # verify job completed every gate (Stage B executes NO candidate code in
  # any job). This job executes NO candidate code and NO candidate scripts:
  # it obtains the verified handoff, re-downloads the exact Stage A bytes,
  # performs the final hash identity check, and creates the release.
  # ---------------------------------------------------------------------------
  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify trusted dispatch contract (policy revision == running workflow revision)
        shell: pwsh
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if ($env:WORKFLOW_REF -ne 'refs/heads/main') {
            throw "this workflow must be dispatched from main (got '$env:WORKFLOW_REF'); the trusted release policy is the main revision being executed"
          }
          if ([string]::IsNullOrWhiteSpace($env:WORKFLOW_SHA)) {
            throw 'github.workflow_sha is empty; the trusted policy revision cannot be bound to the workflow file being executed'
          }
          if ($env:WORKFLOW_SHA -ne $env:DISPATCH_SHA) {
            throw "github.workflow_sha '$env:WORKFLOW_SHA' != github.sha '$env:DISPATCH_SHA'; the workflow-file revision being executed is not the dispatch commit - refusing to guess a trusted policy revision"
          }
          Write-Host "Trusted dispatch contract verified: ref=$env:WORKFLOW_REF workflow_sha=$env:WORKFLOW_SHA sha=$env:DISPATCH_SHA" -ForegroundColor Green

      # Trusted policy module for tag derivation - never candidate code.
      - name: Checkout trusted release policy (current workflow revision)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Least privilege: this checkout performs no authenticated git
          # operation (push/merge); no credentials are persisted in .git.
          persist-credentials: false
          ref: ${{ github.sha }}
          path: policy

      - name: Download the verified same-run handoff
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tabdock-verified-${{ github.run_id }}
          path: verified-handoff

      # Re-download the EXACT Stage A bytes (not the handoff's copy - the
      # published bytes always come from the immutable Stage A artifact).
      - name: Download the EXACT Stage A candidate artifact (cross-run)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.verify.outputs.candidate_artifact_name }}
          run-id: ${{ inputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate-artifact

      # Final hash identity check: the exact Stage A bytes must be identical
      # to the bytes the verify job gated (the handoff record's
      # artifactSha256), and the manifest must agree on SHA, version, and the
      # derived tag. No candidate code runs here.
      - name: Verify handoff and final artifact hash identity
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.run-id }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.verify.outputs.candidate_artifact_name }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'policy/scripts/release-tooling.ps1')
          $recordPath = Join-Path 'verified-handoff' 'publication-verification.json'
          if (-not (Test-Path -LiteralPath $recordPath -PathType Leaf)) {
            throw 'the verified same-run handoff (publication-verification.json) is missing; the verify job must have completed every gate first'
          }
          $record = Get-Content -LiteralPath $recordPath -Raw | ConvertFrom-Json
          if ([string]$record.recordKind -ne 'publication-verification') { throw 'handoff record kind is not publication-verification' }
          if ([int]$record.schemaVersion -ne 1) { throw "handoff record schemaVersion=$($record.schemaVersion) (expected 1)" }
          if ([string]$record.productionReleaseEligibility -ne 'ELIGIBLE') { throw "handoff record productionReleaseEligibility=$($record.productionReleaseEligibility) (expected ELIGIBLE after the verify job gate)" }
          if ([string]$record.candidateWorkflowRunId -ne $env:CANDIDATE_RUN_ID) { throw "handoff candidateWorkflowRunId $($record.candidateWorkflowRunId) != the requested Stage A run $env:CANDIDATE_RUN_ID" }
          if ([string]$record.candidateArtifactName -ne $env:CANDIDATE_ARTIFACT_NAME) { throw "handoff candidateArtifactName $($record.candidateArtifactName) != the located artifact $env:CANDIDATE_ARTIFACT_NAME" }
          if ([string]$record.sourceCommitSha -notmatch '^[0-9a-f]{40}$') { throw 'handoff sourceCommitSha is malformed' }
          if ([string]$record.artifactSha256 -notmatch '^[0-9a-f]{64}$') { throw 'handoff artifactSha256 is malformed' }

          $dir = Join-Path $env:GITHUB_WORKSPACE 'candidate-artifact'
          $manifest = Get-Content (Join-Path $dir 'release-manifest.json') -Raw | ConvertFrom-Json
          if (-not [string]::Equals([string]$manifest.sourceCommitSha, [string]$record.sourceCommitSha, [StringComparison]::OrdinalIgnoreCase)) {
            throw "manifest sourceCommitSha $($manifest.sourceCommitSha) != handoff sourceCommitSha $($record.sourceCommitSha)"
          }
          if (-not [string]::Equals([string]$manifest.semanticVersion, [string]$record.semanticVersion, [StringComparison]::OrdinalIgnoreCase)) {
            throw "manifest semanticVersion $($manifest.semanticVersion) != handoff semanticVersion $($record.semanticVersion)"
          }
          if (-not [string]::Equals([string]$manifest.artifactSha256, [string]$record.artifactSha256, [StringComparison]::OrdinalIgnoreCase)) {
            throw "manifest artifactSha256 $($manifest.artifactSha256) != handoff artifactSha256 $($record.artifactSha256)"
          }

          # Final hash identity: the bytes this job is about to publish must
          # be byte-identical to the bytes the verify job gated.
          $actual = Get-FileSha256Lower (Join-Path $dir 'TabDock.exe')
          if ($actual -ne [string]$record.artifactSha256) {
            throw "final hash identity check FAILED: on-disk TabDock.exe SHA-256 $actual != verified handoff artifactSha256 $($record.artifactSha256)"
          }
          $sums = Read-Sha256Sums (Join-Path $dir 'SHA256SUMS.txt')
          if ($sums.Hash -ne [string]$record.artifactSha256) {
            throw "final hash identity check FAILED: SHA256SUMS.txt $($sums.Hash) != verified handoff artifactSha256 $($record.artifactSha256)"
          }

          # Tag identity: the derived tag recorded by the verify job must be
          # exactly v<semanticVersion> - the publish job performs NO build,
          # NO sign, and NO candidate execution; only this hash identity
          # check and the release mutation.
          $derived = Get-ReleaseTagFromVersion ([string]$record.semanticVersion)
          if ([string]$record.releaseTag -ne $derived) {
            throw "handoff releaseTag $($record.releaseTag) != derived v<semanticVersion> tag $derived"
          }
          Write-Host "Final hash identity check: PASS (SHA-256 $($record.artifactSha256); tag $derived at $($record.sourceCommitSha))" -ForegroundColor Green

      # Intentional publication of the EXACT verified bytes. The derived tag
      # is created at the exact candidate SHA; no source modification, no
      # second compilation, no signing, and no candidate execution occur here.
      # The evidence (validated by the verify job and carried in the verified
      # handoff) and the publication verification record travel with the
      # release as assets. The required-assets gate fails closed BEFORE the
      # release mutation if any asset is missing from the publish workspace.
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . (Join-Path $env:GITHUB_WORKSPACE 'policy/scripts/release-tooling.ps1')
          $record = Get-Content (Join-Path 'verified-handoff' 'publication-verification.json') -Raw | ConvertFrom-Json
          $tag = [string]$record.releaseTag

          # R21-002 fail-closed gate: every required release asset must
          # physically exist in this workspace before `gh release create`.
          Assert-ReleaseAssetsPresent -CandidateArtifactDir 'candidate-artifact' -VerifiedHandoffDir 'verified-handoff'

          gh release create $tag --repo ${{ github.repository }} `
            --target $([string]$record.sourceCommitSha) `
            --title "TabDock $($record.semanticVersion)" `
            --notes-file verified-handoff/RELEASE_NOTES.md `
            candidate-artifact/TabDock.exe `
            candidate-artifact/SHA256SUMS.txt `
            candidate-artifact/release-manifest.json `
            verified-handoff/release-external-evidence.json `
            verified-handoff/publication-verification.json

      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $record = Get-Content (Join-Path 'verified-handoff' 'publication-verification.json') -Raw | ConvertFrom-Json
          $tag = [string]$record.releaseTag
          $assets = gh release view $tag --repo ${{ github.repository }} --json assets --jq '.assets[].name'
          $required = @('TabDock.exe', 'SHA256SUMS.txt', 'release-manifest.json', 'release-external-evidence.json', 'publication-verification.json')
          foreach ($name in $required) {
            if ($assets -notcontains $name) {
              throw "Release asset missing after publication: $name"
            }
          }
          Write-Host "Release assets verified: PASS ($tag)"
