name: temporary-split-regression-patch

on:
  push:
    paths:
      - '.github/workflows/_temporary_split_regression_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Rewrite obsolete split regression expectations
        run: python scripts/patch_split_regression_expectations.py
      - name: Validate and publish the bounded test rewrite
        shell: bash
        run: |
          git diff --check
          git diff -- tests/ValidationDriver/TabDock.ValidationDriver/Scenarios.Split.cs
          git config user.name 'TabDock CI patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/ValidationDriver/TabDock.ValidationDriver/Scenarios.Split.cs
          git diff --cached --check
          git commit -m 'test: align split third-tab regression expectations'
          git push origin HEAD:main
