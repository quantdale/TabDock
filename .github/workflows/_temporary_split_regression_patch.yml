name: temporary-split-regression-patch

on:
  push:
    paths:
      - '.github/workflows/_temporary_split_regression_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Reconcile canonical split contract
        run: python scripts/patch_split_canonical_contract.py
      - name: Validate and publish the bounded spec rewrite
        shell: bash
        run: |
          git diff --check
          git diff -- openspec/specs/ui-ux-hardening/spec.md
          git config user.name 'TabDock CI patcher'
          git config user.email 'actions@users.noreply.github.com'
          git add openspec/specs/ui-ux-hardening/spec.md
          git diff --cached --check
          git commit -m 'spec: reconcile split third-tab canonical contract'
          git push origin HEAD:main
