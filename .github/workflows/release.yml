name: release

# RC QUALIFICATION-ONLY workflow (never publishes). Intentionally NOT
# triggered by pushes: a main push produces a candidate build through
# build.yml, and release candidate preparation is an explicit, exact-SHA,
# qualification-gated decision. Run this workflow manually with a specific
# commit SHA to qualify the exact source and retain an RC artifact.
#
# This workflow has NO publication path: a GitHub Release is never created
# here. The two-stage production chain lives in the dedicated workflows:
#   STAGE A  prepare-release-candidate.yml - builds, qualifies, signs, and
#            retains the immutable PRODUCTION candidate (signing mandatory).
#   STAGE B  publish-release.yml - downloads the retained Stage A artifact
#            and publishes those EXACT bytes (no rebuild, no re-sign).
# RC qualification may run unsigned (NOT_CONFIGURED) or signed with the
# local-pfx provider (development/private certificates only - never the
# approved public-GA signer), and never requires external evidence.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact source commit SHA to qualify (required)'
        required: true
        type: string
      version:
        description: 'Expected semantic version (must equal TabDock.csproj <Version>, which is authoritative)'
        required: false
        default: '1.0.0'
        type: string
      signing-required:
        description: 'Treat missing Authenticode material as a qualification failure'
        required: false
        default: false
        type: boolean
      signing-provider:
        description: 'Signing backend: not-configured (default, unsigned) or local-pfx (development/private certificate; NEVER the approved public-GA signer). digicert-stm is not supported on this RC-only path (no DigiCert tooling setup) and is never needed here.'
        required: false
        default: 'not-configured'
        type: choice
        options:
          - not-configured
          - local-pfx
          - digicert-stm

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    steps:
      # Current checkout action: Node 24 action runtime (runner-supported).
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      # The workflow must operate on the exact requested commit; a mismatch
      # aborts before any build work begins.
      - name: Verify exact candidate SHA
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ inputs.sha }}') {
            throw "Checked out $actual but the release candidate was requested as ${{ inputs.sha }}"
          }
          Write-Host "Candidate SHA verified: $actual"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: tools/openspec/package-lock.json

      - name: Install pinned OpenSpec CLI
        working-directory: tools/openspec
        run: npm ci --ignore-scripts

      # Canonical hermetic qualification (audited restore, Release builds,
      # self-tests, doctor/version/bundle privacy, OpenSpec validation).
      # SendInput/hardware scenarios never run on the hosted runner.
      - name: Canonical qualification
        shell: pwsh
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
          OPENSPEC_TELEMETRY: '0'
        run: .\scripts\validate.ps1 -Configuration Release -Ci

      # Exact-SHA artifact chain: publish -> execute + qualify the exact
      # binary -> optional signing (SIGNING_PROVIDER selects the backend:
      # not-configured = unsigned RC, local-pfx = development/private
      # certificate) -> signature verification -> SHA-256 ->
      # release-manifest.json + SHA256SUMS.txt (both describing the FINAL
      # distributed bytes) -> immutable artifact retention. The qualified
      # artifact is uploaded without any rebuild. Signing is optional here:
      # the manifest records NOT_CONFIGURED without a provider unless
      # signing-required=true. LOCAL-PFX IS NOT THE APPROVED PUBLIC-GA
      # SIGNER; production candidates come only from
      # prepare-release-candidate.yml.
      - name: Release qualification and artifact provenance
        shell: pwsh
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
          OPENSPEC_TELEMETRY: '0'
          SIGNING_PROVIDER: ${{ inputs.signing-provider }}
          SIGNCERT_BASE64: ${{ secrets.SIGNCERT_BASE64 }}
          SIGNCERT_PASSWORD: ${{ secrets.SIGNCERT_PASSWORD }}
          SIGNCERT_TIMESTAMP: ${{ secrets.SIGNCERT_TIMESTAMP }}
          RELEASE_SIGNING_REQUIRED: ${{ inputs.signing-required == 'true' }}
        run: .\scripts\release-qualify.ps1 -Ci -Sha '${{ inputs.sha }}' -Version '${{ inputs.version }}' -Sign -OutDir (Join-Path $env:RUNNER_TEMP 'release-artifacts')

      # Immutable retention of the exact qualified RC artifact.
      - name: Upload qualified release artifact
        uses: actions/upload-artifact@v7
        with:
          name: tabdock-rc-${{ inputs.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: error
          retention-days: 90

      # The RC handoff: the artifact is retained here for inspection. It is
      # NOT a production candidate and can never be published: production
      # candidates are prepared (signed) and published by the two-stage
      # workflows above.
      - name: Record RC artifact identity
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          $manifest = Get-Content (Join-Path $dir 'release-manifest.json') -Raw | ConvertFrom-Json
          $summary = @"
          ## RC qualification artifact (NOT a production candidate)

          - RC workflow run: `${{ github.run_id }}
          - Artifact name: tabdock-rc-`${{ inputs.sha }}`-`${{ github.run_id }}
          - Source commit: `${{ inputs.sha }}
          - Semantic version: `$($manifest.semanticVersion)`
          - Final distributed SHA-256: `$($manifest.artifactSha256)`
          - Signing: `$($manifest.signingStatus)` / `$($manifest.signatureVerification)`
          - releaseMode: `$($manifest.releaseMode)` (never publishable)

          This artifact supports RC/beta testing only. The production publication
          chain requires a signed candidate from prepare-release-candidate.yml and the
          publish-release.yml gate.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
