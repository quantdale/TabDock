name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Current checkout action: Node 24 action runtime (runner-supported).
      # Least privilege: no authenticated git operation is performed here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Current setup action: Node 24 action runtime; SDK remains .NET 8.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # OpenSpec 1.8.0 declares Node >=20.19.0; Node 24 is compatible and
      # avoids the deprecated Node 20 runtime on the hosted runner. This is
      # the intentionally installed CLI runtime, distinct from action hosts.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: tools/openspec/package-lock.json

      - name: Install pinned OpenSpec CLI
        # Keep the CLI repository-owned and reproducible. OpenSpec's optional
        # postinstall is not needed for validation, so lifecycle scripts remain
        # disabled rather than being globally approved.
        working-directory: tools/openspec
        run: npm ci --ignore-scripts

      # This is intentionally the hermetic qualification entry point. It runs
      # audited restore, Release builds, native/geometry/diagnostics/persistence
      # self-tests, doctor/version/bundle privacy checks, OpenSpec validation,
      # and a publish --version smoke. SendInput/hardware scenarios remain
      # supervised and are never run on the hosted runner.
      - name: Run Release qualification
        shell: pwsh
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
          OPENSPEC_TELEMETRY: '0'
        run: .\scripts\validate.ps1 -Configuration Release -Ci -Publish

      # The release-control regression suite (P1): deterministic adversarial
      # tests of the two-stage release chain, the signing-provider policy,
      # the trusted-policy trust boundary, the policy-schema contract, and
      # the static workflow guarantees. It is hermetic (no real certificates,
      # no signing, no provider contact, no publication, no network beyond
      # ordinary restore), fails the build on any regression, and makes the
      # release-control suite an exact-SHA hosted-CI gate. It never depends
      # on DigiCert credentials.
      - name: Run release-tooling regression suite
        shell: pwsh
        run: .\scripts\release-tooling-tests.ps1

  # Independent native-ABI evidence on a second Windows OS build (the
  # windows-2022 runner image): proves the WINDOWPLACEMENT 44-byte user32
  # contract on a Windows version different from windows-latest and prints the
  # per-machine environment report. The self-test is hermetic (a never-shown
  # probe window, no input), so it is safe on the hosted runner. This is
  # evidence for docs/release/compatibility-matrix.md, not a substitute for
  # the external Windows 10 x64 qualification.
  native-abi-evidence:
    runs-on: windows-2022
    steps:
      # Least privilege: no authenticated git operation is performed here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build Release for native ABI evidence
        run: dotnet build TabDock.sln -c Release --nologo

      - name: Run native ABI self-test (real user32 placement contract)
        shell: pwsh
        run: .\bin\Release\net8.0-windows\win-x64\TabDock.exe --selftest-native-abi
