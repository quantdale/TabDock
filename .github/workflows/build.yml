name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Current checkout action: Node 24 action runtime (runner-supported).
      - uses: actions/checkout@v7

      # Current setup action: Node 24 action runtime; SDK remains .NET 8.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # OpenSpec 1.8.0 declares Node >=20.19.0; Node 24 is compatible and
      # avoids the deprecated Node 20 runtime on the hosted runner. This is
      # the intentionally installed CLI runtime, distinct from action hosts.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Install pinned OpenSpec CLI
        # OpenSpec 1.8.0's postinstall only prints an opt-in shell-completion
        # hint (and is skipped in CI); validation does not need it. Keep the
        # pinned global install hermetic without approving lifecycle scripts.
        run: npm install --global --ignore-scripts @fission-ai/openspec@1.8.0

      # This is intentionally the hermetic qualification entry point. It runs
      # audited restore, Release builds, native/geometry/diagnostics/persistence
      # self-tests, doctor/version/bundle privacy checks, OpenSpec validation,
      # and a publish --version smoke. SendInput/hardware scenarios remain
      # supervised and are never run on the hosted runner.
      - name: Run Release qualification
        shell: pwsh
        env:
          OPENSPEC_NO_UPDATE_CHECK: '1'
          OPENSPEC_TELEMETRY: '0'
        run: .\scripts\validate.ps1 -Configuration Release -Ci -Publish
