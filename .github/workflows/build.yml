# Action pinning (P2): every `uses: actions/...` step is pinned to an immutable
# full commit SHA with a trailing `# vX` comment for human readability.
# To update: resolve the new tag via `gh api` (lightweight tags):
#   gh api repos/actions/checkout/git/refs/tags/v7 --jq '.object.sha'
# Verify the SHA matches the intended release, replace the SHA in this file,
# keep the `# vX.Y.Z` comment, then run `pwsh -File scripts/release-tooling-tests.ps1`.
name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      actions: write
    runs-on: windows-latest
    steps:
      # Current checkout action: Node 24 action runtime (runner-supported).
      # Least privilege: no authenticated git operation is performed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Current setup action: Node 24 action runtime; SDK remains .NET 8.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.1.0
        with:
          dotnet-version: 8.0.x

      # OpenSpec 1.8.0 declares Node >=20.19.0; Node 24 is compatible and
      # avoids the deprecated Node 20 runtime on the hosted runner. This is
      # the intentionally installed CLI runtime, distinct from action hosts.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: tools/openspec/package-lock.json

      - name: Install pinned OpenSpec CLI
        # Keep the CLI repository-owned and reproducible. OpenSpec's optional
        # postinstall is not needed for validation, so lifecycle scripts remain
        # disabled rather than being globally approved.
        working-directory: tools/openspec
        run: npm ci --ignore-scripts

      # This is intentionally the qualification entry point. It runs audited
      # restore, Release builds, the headless xUnit suite (the hermetic
      # behavioral authority), the executable native-ABI probe, doctor/version/
      # bundle privacy smokes, OpenSpec validation, and a publish --version
      # smoke. SendInput/hardware scenarios remain supervised and are never run
      # on the hosted runner.
      - name: Run Release qualification
        shell: pwsh
        env:
          OPENSPEC_NO_UPDATE_CHECK: "1"
          OPENSPEC_TELEMETRY: "0"
        run: .\scripts\validate.ps1 -Configuration Release -Ci -Publish

      # The release-control regression suite (P1): deterministic adversarial
      # tests of the two-stage release chain, the signing-provider policy,
      # the trusted-policy trust boundary, the policy-schema contract, and
      # the static workflow guarantees. It is hermetic (no real certificates,
      # no signing, no provider contact, no publication, no network beyond
      # ordinary restore), fails the build on any regression, and makes the
      # release-control suite an exact-SHA hosted-CI gate. It never depends
      # on DigiCert credentials.
      - name: Run release-tooling regression suite
        shell: pwsh
        run: .\scripts\release-tooling-tests.ps1

      # Retain the deterministic ValidationDriver hierarchy as a CI artifact.
      # This is native-free evidence only: the topology report is explicitly
      # synthetic and never satisfies a physical mixed-DPI publication gate.
      - name: Generate deterministic qualification artifacts
        shell: pwsh
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP ("tabdock-qualification-" + $env:GITHUB_SHA_VALUE)
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:TABDOCK_VALIDATION_DRIVER_PATH = Join-Path $env:GITHUB_WORKSPACE 'tests\ValidationDriver\TabDock.ValidationDriver\bin\Release\net8.0-windows\TabDock.ValidationDriver.exe'
          $env:TABDOCK_VALIDATION_ARTIFACT_ROOT = $root
          $env:TABDOCK_VALIDATION_RUN_KIND = 'deterministic'
          dotnet run --project tests\ValidationDriver\TabDock.ValidationDriver\TabDock.ValidationDriver.csproj -c Release --no-restore --no-build -- --selftest all --configuration Release --rid none
          if ($LASTEXITCODE -ne 0) { throw "deterministic ValidationDriver exited $LASTEXITCODE" }
          $manifest = Get-ChildItem -LiteralPath $root -Recurse -File -Filter run-manifest.json | Select-Object -First 1
          if ($null -eq $manifest) { throw 'deterministic qualification did not produce a run-manifest.json' }
          $run = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          "Qualification source SHA: $env:GITHUB_SHA_VALUE" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Qualification run manifest schema: $($run.schemaVersion); catalog: $($run.catalogGeneration); outcome: $($run.outcome)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Topology evidence: syntheticTopology=true (deterministic lab; not physical qualification)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload deterministic qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tabdock-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/tabdock-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30

  # Independent native-ABI evidence on a second Windows OS build (the
  # windows-2022 runner image): proves the WINDOWPLACEMENT 44-byte user32
  # contract on a Windows version different from windows-latest and prints the
  # per-machine environment report. The self-test is hermetic (a never-shown
  # probe window, no input), so it is safe on the hosted runner. This is
  # evidence for docs/release/compatibility-matrix.md, not a substitute for
  # the external Windows 10 x64 qualification.
  native-abi-evidence:
    runs-on: windows-2022
    steps:
      # Least privilege: no authenticated git operation is performed here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - name: Build Release for native ABI evidence
        run: dotnet build TabDock.sln -c Release --nologo

      - name: Run native ABI self-test (real user32 placement contract)
        shell: pwsh
        run: .\bin\Release\net8.0-windows\win-x64\TabDock.exe --selftest-native-abi
