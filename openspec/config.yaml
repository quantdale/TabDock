schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Tech stack: C# 12 / .NET 8 / WPF (net8.0-windows), Windows 10/11 x64.
  Native interop is P/Invoke in NativeMethods.cs. The only added package is
  Microsoft-maintained System.Threading.AccessControl for the product-mutation
  lease; do not add unrelated third-party NuGet packages or remove that one.
  Capture model: "Shepherd" - guests are never reparented; TabDock positions
  and z-orders the external HWND over the container's content area.
  Architecture: Services/, Models/, ViewModels/, Views/,
  Infrastructure/ (NativeHwndHost, MotionProfile, WindowChromeTheme,
  BindingTraceDiagnostics), Converters/. Accent selection is the container
  color chip, not a PickColorCommand.
  Code style: file-scoped namespaces, explicit usings (ImplicitUsings
  disabled), nullable reference types enabled, XML doc comments on public
  types, all P/Invoke centralized in NativeMethods.cs.
  Workflow: OpenSpec (spec-driven) - change proposals live in
  openspec/changes/, capability specs in openspec/specs/.
  Testing: tests/ValidationDriver (TabDock.ValidationDriver + GuineaPig)
  drives TabDock via real SendInput at UIA-read coordinates; scenarios must
  never assert on log instrumentation absent from committed source. See
  docs/TESTING.md.

